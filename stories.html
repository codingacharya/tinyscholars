<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Time</title>
<script src="jquery.min.js"></script>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:600px;margin:0 auto;padding:14px}
h1{text-align:center;font-size:2.6rem;margin:6px 0 14px;color:#fff;text-shadow:0 3px 4px rgba(0,0,0,.35)}
.covers{display:grid;gap:18px}
.cover{border:0;border-radius:30px;padding:18px 10px 12px;cursor:pointer;color:var(--ink);box-shadow:0 9px 0 rgba(0,0,0,.18),0 14px 24px rgba(0,0,0,.2);transition:transform .15s}
.cover:active{transform:translateY(4px)}
.cover .em{font-size:5.4rem;line-height:1.1;display:block;animation:bounce 2.2s ease-in-out infinite}
.pill{display:inline-block;background:#fff;border-radius:999px;padding:5px 18px;font-size:1.15rem;font-weight:700;margin-top:6px}
#player{display:none}
.top{display:flex;justify-content:space-between;margin-bottom:10px}
.ib{border:0;border-radius:50%;width:60px;height:60px;font-size:1.9rem;background:var(--card);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.ib:active{transform:translateY(3px)}
#stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:26px;overflow:hidden;box-shadow:0 9px 0 rgba(0,0,0,.18),0 14px 24px rgba(0,0,0,.2)}
.actor{position:absolute;transform:translate(-50%,-50%);line-height:1;transition:left 3.2s ease-in-out,top 3.2s ease-in-out;white-space:nowrap}
.an{display:inline-block}
.bounce{animation:bounce 1s ease-in-out infinite}
.hop{animation:hop .5s ease-in-out infinite}
.float{animation:float 2s ease-in-out infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.shake{animation:shake .5s linear infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22%) rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25%)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
#cap{background:var(--card);border-radius:18px;padding:10px 14px;margin:14px 0 8px;font-size:1.05rem;text-align:center;min-height:3.2rem}
.ctl{display:flex;justify-content:center;gap:14px;margin-top:8px}
#dots{text-align:center;font-size:1.1rem;letter-spacing:3px;margin-top:10px}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:2.4rem;transition:transform 1.1s ease-out,opacity 1.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="container">
  <div id="home">
    <h1>📖 Story Time</h1>
    <div class="covers" id="covers"></div>
  </div>
  <div id="player">
    <div class="top"><button class="ib" id="homeb" aria-label="Home">🏠</button><button class="ib" id="snd" aria-label="Sound">🔊</button></div>
    <div id="stage"></div>
    <div id="cap"></div>
    <div class="ctl">
      <button class="ib" id="prev" aria-label="Back">⏮</button>
      <button class="ib" id="pp" aria-label="Play or pause">⏸</button>
      <button class="ib" id="nextb" aria-label="Next">⏭</button>
      <button class="ib" id="again" aria-label="Again">🔁</button>
    </div>
    <div id="dots"></div>
  </div>
</div>
<script>
$(function(){
  /* ===== ADD NEW STORIES HERE: copy one story block and change it =====
     scene = { bg, say, act:[ {e:emoji, x, y (percent), s:size, to:[x,y] (moves there), d:delay seconds,
               a:"bounce|hop|float|pulse|shake"} ] }                                           */
  var BG={day:"linear-gradient(#8fd3ff 0 58%,#7bd36b 58%)",desert:"linear-gradient(#ffe29a 0 58%,#e9c46a 58%)",jungle:"linear-gradient(#b8f0c0 0 58%,#3fa65a 58%)",gold:"radial-gradient(#fff3b0,#ffc93c)"};
  var STORIES=[
   {name:"The Hare and the Tortoise",cover:"🐇🐢",c1:"#ff9f6b",c2:"#ffd36b",
    scenes:[
     {bg:"day",say:"A fast hare laughed at a slow tortoise. The tortoise said, let us have a race!",act:[{e:"🐇",x:14,y:64,s:16,a:"bounce"},{e:"🐢",x:34,y:74,s:13},{e:"☁️",x:60,y:15,s:14,to:[88,15]}]},
     {bg:"day",say:"Ready, set, go! The hare ran far, far ahead.",act:[{e:"🏁",x:92,y:62,s:12},{e:"🐇",x:10,y:62,s:16,to:[72,62],a:"hop"},{e:"🐢",x:10,y:74,s:13,to:[24,74]}]},
     {bg:"day",say:"The hare felt sure he would win. So he took a long nap under a tree.",act:[{e:"🌳",x:76,y:48,s:24},{e:"🐇",x:72,y:68,s:15},{e:"💤",x:82,y:46,s:10,a:"float"},{e:"🐢",x:24,y:75,s:13,to:[52,75]}]},
     {bg:"day",say:"The tortoise never stopped. Step by step, slowly and steadily, he kept on walking.",act:[{e:"🌳",x:76,y:48,s:24},{e:"🐇",x:72,y:68,s:15},{e:"💤",x:82,y:46,s:10,a:"float"},{e:"🏁",x:92,y:62,s:12},{e:"🐢",x:52,y:75,s:13,to:[90,75]}]},
     {bg:"day",say:"The tortoise won the race! The hare woke up too late.",act:[{e:"🐢",x:80,y:70,s:15,a:"bounce"},{e:"🏆",x:80,y:44,s:14,a:"pulse"},{e:"🎉",x:50,y:20,s:12,a:"pulse"},{e:"🐇",x:14,y:66,s:15,to:[52,66]}]}
    ],moral:{e:"🐢🏆",say:"Slow and steady wins the race. Never give up!"}},
   {name:"The Clever Crow",cover:"🐦💧",c1:"#6bb8ff",c2:"#8c7bff",
    scenes:[
     {bg:"desert",say:"It was a very hot day. A thirsty crow flew far and wide, looking for water.",act:[{e:"☀️",x:86,y:14,s:14,a:"pulse"},{e:"🌵",x:18,y:68,s:14},{e:"🐦",x:8,y:36,s:14,to:[70,30],a:"float"}]},
     {bg:"desert",say:"At last, he found a pot with a little water. But the water was too low to reach.",act:[{e:"🏺",x:62,y:64,s:24},{e:"🐦",x:20,y:58,s:14,to:[42,52],a:"bounce"},{e:"❓",x:30,y:30,s:12,a:"pulse"}]},
     {bg:"desert",say:"Then he had a clever idea! He dropped little stones into the pot, one by one.",act:[{e:"🏺",x:62,y:64,s:24},{e:"🐦",x:30,y:44,s:14,a:"bounce"},{e:"💡",x:30,y:20,s:11,a:"pulse"},{e:"🪨",x:44,y:28,s:7,to:[60,58],d:0},{e:"🪨",x:46,y:28,s:7,to:[62,58],d:1.2},{e:"🪨",x:48,y:28,s:7,to:[61,60],d:2.4}]},
     {bg:"desert",say:"The water came up, and up, and up!",act:[{e:"🏺",x:62,y:64,s:24},{e:"💧",x:62,y:50,s:14,a:"pulse"},{e:"🐦",x:38,y:52,s:14,to:[48,48],a:"bounce"}]},
     {bg:"desert",say:"The crow drank the cool water. He was so happy!",act:[{e:"🏺",x:70,y:66,s:22},{e:"🐦",x:48,y:56,s:16,a:"bounce"},{e:"🎉",x:28,y:22,s:12,a:"pulse"},{e:"💧",x:70,y:46,s:9,a:"float"}]}
    ],moral:{e:"💡🐦",say:"Think smart. Where there is a will, there is a way!"}},
   {name:"The Lion and the Mouse",cover:"🦁🐭",c1:"#ffd36b",c2:"#7be0a8",
    scenes:[
     {bg:"jungle",say:"A big lion was fast asleep. A tiny mouse ran over his nose.",act:[{e:"🌴",x:10,y:44,s:18},{e:"🦁",x:60,y:62,s:20},{e:"💤",x:72,y:38,s:10,a:"float"},{e:"🐭",x:12,y:76,s:10,to:[58,50],a:"hop"}]},
     {bg:"jungle",say:"The lion woke up and caught the mouse. Please let me go, said the mouse. One day I will help you. The lion smiled and let him go.",act:[{e:"🌴",x:10,y:44,s:18},{e:"🦁",x:55,y:60,s:20,a:"shake"},{e:"🐭",x:60,y:76,s:10,a:"bounce"},{e:"💢",x:68,y:36,s:10,a:"pulse"}]},
     {bg:"jungle",say:"Later, the lion got stuck in a hunter’s net. He roared and roared, but he could not get out.",act:[{e:"🌴",x:10,y:44,s:18},{e:"🦁",x:52,y:62,s:20,a:"shake"},{e:"🕸️",x:52,y:60,s:28,a:"pulse"}]},
     {bg:"jungle",say:"The little mouse heard him. He ran over and chewed the ropes, nibble, nibble, nibble.",act:[{e:"🌴",x:10,y:44,s:18},{e:"🦁",x:56,y:62,s:20},{e:"🕸️",x:56,y:60,s:28},{e:"🐭",x:12,y:80,s:10,to:[46,72],a:"hop"}]},
     {bg:"jungle",say:"The lion was free! From that day, the lion and the mouse were best friends.",act:[{e:"🌴",x:10,y:44,s:18},{e:"🦁",x:40,y:62,s:20,a:"bounce"},{e:"🐭",x:64,y:74,s:12,a:"bounce"},{e:"💖",x:52,y:28,s:14,a:"pulse"}]}
    ],moral:{e:"🦁💖🐭",say:"Be kind to everyone. Even small friends can help big ones!"}}
  ];
  var cur=null,idx=0,tok=0,playing=true,sound=true;
  function unit(){$("#stage").css("--u",($("#stage").width()/100)+"px");}
  function burst(){
    var B=["⭐","🎈","🎉","🌟","💖","🦋"],o=$("#stage").offset(),cx=o.left+$("#stage").width()/2-$(window).scrollLeft(),cy=o.top+$("#stage").height()/2-$(window).scrollTop();
    for(var i=0;i<20;i++){(function(i){
      var $b=$("<span class='burst'>").text(B[i%6]).css({left:cx,top:cy,opacity:1}).appendTo("body"),a=Math.random()*6.28,d=90+Math.random()*140;
      setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) rotate("+Math.floor(Math.random()*360)+"deg)",opacity:0});},20);
      setTimeout(function(){$b.remove();},1200);})(i);}
  }
  function narrate(text,my,cb){
    var done=false;
    function fin(){if(done||my!==tok)return;done=true;setTimeout(function(){if(my===tok&&playing)cb();},900);}
    if(sound&&window.speechSynthesis){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=.85;u.pitch=1.2;u.onend=fin;speechSynthesis.speak(u);}catch(e){}}
    setTimeout(fin,text.length*(sound?90:60)+3500);
  }
  function dots(){
    var n=cur.scenes.length+1,s="";
    for(var i=0;i<n;i++)s+=(i===idx?"🟠":"⚪");
    $("#dots").text(s);
  }
  function show(i){
    tok++;var my=tok;idx=i;unit();dots();
    var last=i>=cur.scenes.length,$s=$("#stage").empty();
    if(last){
      $s.css("background",BG.gold);
      $("<div class='actor'>").css({left:"50%",top:"50%",fontSize:"calc(var(--u)*"+(cur.moral.e.length>4?18:26)+")"}).append($("<span class='an pulse'>").text(cur.moral.e)).appendTo($s);
      $("<div class='actor'>").css({left:"15%",top:"18%",fontSize:"calc(var(--u)*10)"}).append($("<span class='an float'>").text("🌟")).appendTo($s);
      $("<div class='actor'>").css({left:"85%",top:"80%",fontSize:"calc(var(--u)*10)"}).append($("<span class='an float'>").text("🌟")).appendTo($s);
      $("#cap").html("<b>"+cur.moral.say+"</b>");
      burst();
      narrate(cur.moral.say,my,function(){playing=false;$("#pp").text("▶️");});
      return;
    }
    var sc=cur.scenes[i];
    $s.css("background",BG[sc.bg]);
    $.each(sc.act,function(_,a){
      var $a=$("<div class='actor'>").css({left:a.x+"%",top:a.y+"%",fontSize:"calc(var(--u)*"+a.s+")",transitionDelay:(a.d||0)+"s"})
        .append($("<span class='an "+(a.a||"")+"'>").text(a.e)).appendTo($s);
      if(a.to)setTimeout(function(){$a.css({left:a.to[0]+"%",top:a.to[1]+"%"});},80);
    });
    $("#cap").text(sc.say);
    narrate(sc.say,my,function(){show(i+1);});
  }
  function open(k){
    cur=STORIES[k];playing=true;$("#pp").text("⏸");
    $("#home").hide();$("#player").show();show(0);
  }
  function home(){tok++;if(window.speechSynthesis)speechSynthesis.cancel();$("#player").hide();$("#home").show();}
  $.each(STORIES,function(k,s){
    $("<button class='cover'>").css("background","linear-gradient(145deg,"+s.c1+","+s.c2+")")
      .html("<span class='em'>"+s.cover+"</span><span class='pill'></span>").on("click",function(){open(k);})
      .appendTo("#covers").find(".pill").text(s.name);
  });
  $("#homeb").on("click",home);
  $("#snd").on("click",function(){sound=!sound;$(this).text(sound?"🔊":"🔇");if(!sound&&window.speechSynthesis)speechSynthesis.cancel();});
  $("#pp").on("click",function(){
    playing=!playing;$(this).text(playing?"⏸":"▶️");
    if(playing)show(idx>=cur.scenes.length?0:idx);else{tok++;if(window.speechSynthesis)speechSynthesis.cancel();}
  });
  $("#prev").on("click",function(){show(Math.max(0,idx-1));});
  $("#nextb").on("click",function(){show(Math.min(cur.scenes.length,idx+1));});
  $("#again").on("click",function(){playing=true;$("#pp").text("⏸");show(0);});
  $(window).on("resize",unit);
});
</script>
<a href="index.html" id="homeFab" aria-label="Home" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;color:#23324a;font-size:1.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)">🏠</a>
</body>
</html>
