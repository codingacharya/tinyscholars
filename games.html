<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="jquery.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Thinking Games</title>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:520px;margin:0 auto;padding:12px 12px 90px}
.row{display:flex;gap:10px}
.tab,.ib{border:0;border-radius:18px;background:var(--card);color:var(--ink);font-size:2rem;padding:8px 0;flex:1;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tab.on,.ib.on{background:#ff9f1c;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 4px;font-size:1.5rem;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.board{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.18);text-align:center;min-height:340px}
.opt{border:0;border-radius:20px;background:#eef6ff;color:var(--ink);font-size:2.4rem;padding:10px 14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.opt:active{transform:translateY(3px)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2.4rem;transition:transform 1.1s ease-out,opacity 1.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mz{display:grid;max-width:340px;margin:0 auto 12px;border:4px solid #6b4f3a;background:#fff9e6}
.mc{aspect-ratio:1;border:0 solid #6b4f3a;display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center}.pad .opt{padding:6px 0;font-size:1.8rem}
.scale{position:relative;height:190px;margin:10px 0}
.beam{position:absolute;left:5%;right:5%;top:30px;height:8px;background:#8a5a3a;border-radius:4px;transition:transform 1s ease;transform-origin:50% 50%}
.pan{position:absolute;top:8px;width:46%;min-height:80px;border-bottom:6px solid #6b4f3a;font-size:1.7rem;line-height:1.2;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end}
.pan.l{left:-4%}.pan.r{right:-4%}
.post{position:absolute;left:50%;top:34px;width:10px;height:150px;margin-left:-5px;background:#8a5a3a;border-radius:5px}
.legend{font-size:1.6rem;margin-bottom:6px}
.track{display:flex;flex-wrap:wrap;gap:6px;min-height:84px;justify-content:center;margin-bottom:14px;font-size:2.2rem}
.wag{border:0;border-radius:16px;background:#ffe8a3;color:var(--ink);font-size:1.9rem;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-width:66px}
.wag small{display:block;font-size:1.5rem;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container">
 <div class="row" id="tabs"><button class="tab on" data-g="maze" aria-label="Maze">🏃</button><button class="tab" data-g="bal" aria-label="Balance">⚖️</button><button class="tab" data-g="train" aria-label="Number train">🚂</button></div>
 <div class="bar"><span id="lvl"></span><span id="stars">⭐ 0</span></div>
 <div class="board" id="board"></div>
</div><a href="index.html" aria-label="Home" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;color:#23324a;font-size:1.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)">🏠</a>
<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
function speak(t){if(!window.speechSynthesis||window.NOSOUND)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t));u.lang="en-IN";u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}
function burst(){var B=["⭐","🎈","🎉","🌟","💖","🦋"],cx=innerWidth/2,cy=innerHeight/3;
 for(var i=0;i<18;i++){(function(i){var $b=$("<span class='burst'>").text(B[i%6]).css({left:cx,top:cy,opacity:1}).appendTo("body"),a=Math.random()*6.28,d=90+Math.random()*140;
 setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)",opacity:0});},20);setTimeout(function(){$b.remove();},1200);})(i);}}

$(function(){
 var game="maze",lv={maze:0,bal:0,train:0},stars=0,locked=false,EM=["🍎","🐟","🍪","🎈","🦆","🍓"];
 function win(){locked=true;stars++;lv[game]++;$("#stars").text("⭐ "+stars);burst();speak(["Great job!","You did it!","Super smart!","Hooray!"][rnd(0,3)]);setTimeout(next,1800);}
 function wrong($e){speak("Try again");$e.addClass("shake");setTimeout(function(){$e.removeClass("shake");},400);}
 function next(){locked=false;$("#lvl").text(new Array(Math.min(lv[game]+1,10)+1).join("🟠"));var $b=$("#board").empty();({maze:maze,bal:balance,train:train})[game]($b);}
 /* 🏃 Maze Runner: bigger maze each level */
 function mk(n){var g=[],i,j;for(i=0;i<n;i++){g[i]=[];for(j=0;j<n;j++)g[i][j]={n:1,e:1,s:1,w:1,v:0};}
  (function carve(x,y){g[y][x].v=1;$.each(shuffle([[0,-1,"n","s"],[1,0,"e","w"],[0,1,"s","n"],[-1,0,"w","e"]]),function(_,q){var nx=x+q[0],ny=y+q[1];
   if(nx>=0&&ny>=0&&nx<n&&ny<n&&!g[ny][nx].v){g[y][x][q[2]]=0;g[ny][nx][q[3]]=0;carve(nx,ny);}});})(0,0);return g;}
 var mazeGo=null;
 function maze($b){
  var n=[4,5,6,7][Math.min(lv.maze,3)],g=mk(n),px=0,py=0,$g=$("<div class='mz'>").css("grid-template-columns","repeat("+n+",1fr)").appendTo($b);
  $("<div class='pad'><span></span><button class='opt' data-d='n'>⬆️</button><span></span><button class='opt' data-d='w'>⬅️</button><button class='opt' data-d='s'>⬇️</button><button class='opt' data-d='e'>➡️</button></div>").appendTo($b);
  function draw(){$g.empty();for(var y=0;y<n;y++)for(var x=0;x<n;x++){var c=g[y][x];
   $("<div class='mc'>").css({borderTopWidth:c.n?4:0,borderRightWidth:c.e?4:0,borderBottomWidth:c.s?4:0,borderLeftWidth:c.w?4:0}).text(x===px&&y===py?"🐶":(x===n-1&&y===n-1?"🏠":"")).appendTo($g);}}
  mazeGo=function(d){if(locked||g[py][px][d])return;if(d==="n")py--;if(d==="s")py++;if(d==="e")px++;if(d==="w")px--;draw();if(px===n-1&&py===n-1)win();};
  draw();$b.find(".pad").on("click","button",function(){mazeGo($(this).data("d"));});
 }
 $(document).on("keydown",function(e){var m={37:"w",38:"n",39:"e",40:"s"}[e.which];if(game==="maze"&&m&&mazeGo){e.preventDefault();mazeGo(m);}});
 /* ⚖️ Balance: which side is heavier? */
 function balance($b){
  var l=lv.bal,a,b,wb=1,ea,eb;
  if(l<1){ea=eb=EM[rnd(0,EM.length-1)];do{a=rnd(1,6);b=rnd(1,6);}while(a===b);}
  else{ea="🍎";eb="🪨";wb=2;do{a=rnd(1,8);b=rnd(1,5);}while(a===b*wb);}
  var ans=a>b*wb?"L":"R";
  if(l>=1)$("<div class='legend'>🪨 = 🍎🍎</div>").appendTo($b);
  var $s=$("<div class='scale'><div class='post'></div><div class='beam'><div class='pan l'></div><div class='pan r'></div></div></div>").appendTo($b);
  $s.find(".l").text(new Array(a+1).join(ea));$s.find(".r").text(new Array(b+1).join(eb));
  $("<div style='font-size:1.7rem;margin:6px'>Which is heavier?</div>").appendTo($b);
  var $o=$("<div class='opts'>").appendTo($b);
  $.each([["L","⬅️"],["R","➡️"]],function(_,x){$("<button class='opt'>").text(x[1]).data("v",x[0]).appendTo($o);});
  $o.on("click",".opt",function(){if(locked)return;if($(this).data("v")===ans){$s.find(".beam").css("transform","rotate("+(ans==="L"?-9:9)+"deg)");win();}else wrong($(this));});
 }
 /* 🚂 Number Train: tap wagons from smallest to biggest */
 function train($b){
  var n=Math.min(4+lv.train,8),step=[1,1,2,5,10][Math.min(lv.train,4)],st=step===1?rnd(1,6):step,vals=[],i,exp=0;
  for(i=0;i<n;i++)vals.push(st+i*step);
  var $t=$("<div class='track'>").text("🚂").appendTo($b),$o=$("<div class='opts'>").appendTo($b);
  $.each(shuffle(vals),function(_,v){$("<button class='wag'><span>🚃</span><small></small></button>").data("v",v).appendTo($o).find("small").text(v);});
  $o.on("click",".wag",function(){
   if(locked)return;var v=$(this).data("v");
   if(v===vals[exp]){$(this).remove();$("<span>").text("🚃"+v).css("font-size","1.4rem").appendTo($t);exp++;if(exp===n)win();}else wrong($(this));
  });
 }
 $("#tabs").on("click",".tab",function(){$("#tabs .tab").removeClass("on");$(this).addClass("on");game=$(this).data("g");next();});
 next();
});
</script>
</body>
</html>
