<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn the World</title>
<script src="jquery.min.js"></script>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS","Nirmala UI",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:760px;margin:0 auto;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab,.sm{border:0;border-radius:18px;background:var(--card);color:var(--ink);font-size:1.9rem;padding:8px 0;flex:1 1 0;min-width:52px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tab.on,.sm.on{background:#ff9f1c;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sm{font-size:1.15rem;font-weight:700;padding:8px 14px;flex:0 0 auto}
#tools{margin:10px 0}
#cap{background:var(--card);border-radius:18px;padding:10px 14px;margin:10px 0;font-size:1.35rem;font-weight:700;text-align:center;min-height:3.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.item{border:0;border-radius:24px;background:var(--card);color:var(--ink);padding:12px 6px 10px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.16);font-family:inherit}
.item:active{transform:translateY(4px)}
.em{display:block;font-size:4.2rem;line-height:1.15}
.nm{display:block;font-size:1.2rem;font-weight:700;margin-top:4px}
.pop{animation:pop .5s}
.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mapbox{background:var(--card);border-radius:22px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.16)}
.map{width:100%;height:auto;display:block;border-radius:16px}
.hot{cursor:pointer}
.em2{font-size:20px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.lab{font-size:9px;font-style:italic;fill:#245;text-anchor:middle;dominant-baseline:middle}
.hide-cap .cap,.hide-riv .riv,.hide-mtn .mtn{display:none}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:2.2rem;transition:transform 1.1s ease-out,opacity 1.1s}
#snd{flex:0 0 auto;min-width:56px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="container">
  <div class="row" id="tabs">
    <button class="tab on" data-t="veg" aria-label="Vegetables">🥦</button>
    <button class="tab" data-t="fruit" aria-label="Fruits">🍎</button>
    <button class="tab" data-t="thing" aria-label="Things">🎒</button>

    <button class="tab" data-t="world" aria-label="World map">🌍</button>

  <div class="row" id="tools"></div>
  <div id="cap">Tap a picture! 👆</div>
  <div id="main"></div>

  }
  function map(){
    $("#main").html("<div class='mapbox' id='mb'>"+(tab==="world"?worldMap():indiaMap())+"</div>");
    $("#cap").text("Tap the map! 👆 ⭐ = capital, 🔵 = river, ⛰️ = mountain");
  }
  $("#main").on("click",".hot",function(){var t=String($(this).data("say"));$("#cap").text(t);speak(t,"en-IN");});
  /* ---------- tabs & tools ---------- */
  function tools(){
    var $t=$("#tools").empty();
    if(DATA[tab]){
      $.each(["EN","हिं","తె"],function(i,n){$("<button class='sm'>").toggleClass("on",i===li).text(n).on("click",function(){li=i;go();}).appendTo($t);});
      $("<button class='sm'>").toggleClass("on",quiz).text("🎯").attr("aria-label","Quiz").on("click",function(){quiz=!quiz;go();}).appendTo($t);
    } else {
      $.each([["cap","📍"],["riv","🌊"],["mtn","⛰️"]],function(_,l){
        $("<button class='sm on'>").text(l[1]).on("click",function(){$(this).toggleClass("on");$("#mb").toggleClass("hide-"+l[0],!$(this).hasClass("on"));}).appendTo($t);
      });
    }
    $("<button class='sm' id='snd'>").text(sound?"🔊":"🔇").on("click",function(){sound=!sound;$(this).text(sound?"🔊":"🔇");if(!sound&&window.speechSynthesis)speechSynthesis.cancel();}).appendTo($t);
  }
  function go(){
    $("#main").empty();tools();
    if(DATA[tab]){$("#cap").text(quiz?"🎯":"Tap a picture! 👆");list();}else map();
  }
  $("#tabs").on("click",".tab",function(){$("#tabs .tab").removeClass("on");$(this).addClass("on");tab=$(this).data("t");go();});
  go();
});
</script>
