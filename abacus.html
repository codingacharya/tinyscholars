<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="jquery.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Abacus</title>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:520px;margin:0 auto;padding:12px 12px 90px}
.row{display:flex;gap:10px}
.tab,.ib{border:0;border-radius:18px;background:var(--card);color:var(--ink);font-size:2rem;padding:8px 0;flex:1;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tab.on,.ib.on{background:#ff9f1c;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 4px;font-size:1.5rem;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.board{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.18);text-align:center;min-height:340px}
.opt{border:0;border-radius:20px;background:#eef6ff;color:var(--ink);font-size:2.4rem;padding:10px 14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.opt:active{transform:translateY(3px)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2.4rem;transition:transform 1.1s ease-out,opacity 1.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.frame{position:relative;width:max-content;margin:6px auto;padding:0 14px;background:#fff3d6;border:8px solid #8a5a3a;border-radius:16px}
.barline{position:absolute;left:0;right:0;top:96px;height:10px;background:#8a5a3a;z-index:1}
.ab{display:flex;gap:10px}
.rod{position:relative;width:62px;height:324px}
.stick{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#a47a5a;border-radius:3px}
.bead{position:absolute;left:50%;margin-left:-28px;width:56px;height:40px;border-radius:50%;cursor:pointer;z-index:2;transition:top .25s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.3)}
.bead.h{background:#ff6b6b}.bead.e{background:#4dabf7}
.pv{text-align:center;font-size:.9rem;font-weight:700;margin-top:4px}
.labels{display:flex;gap:10px;justify-content:center;margin-bottom:6px}.labels span{width:62px;text-align:center;font-weight:700;font-size:.95rem}
#num{font-size:3.4rem;font-weight:700;cursor:pointer;margin:6px 0}
#q{font-size:2.6rem;font-weight:700;min-height:3.6rem}
</style>
</head>
<body>
<div class="container">
 <div class="row" id="tabs"><button class="tab on" data-m="free" aria-label="Free play">🖐️</button><button class="tab" data-m="show" aria-label="Show me">🎯</button><button class="tab" data-m="add" aria-label="Add">➕</button><button class="tab" id="reset" aria-label="Clear">🧹</button></div>
 <div class="bar"><span id="lvl"></span><span id="stars">⭐ 0</span><button id="snd" style="border:0;background:none;font-size:1.8rem">🔊</button></div>
 <div class="board"><div id="q"></div><div class="frame"><div class="barline"></div><div class="ab" id="ab"></div></div>
 <div class="labels"><span>1000</span><span>100</span><span>10</span><span>1</span></div><div id="num" title="Tap to hear">0</div></div>
</div><a href="index.html" aria-label="Home" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;color:#23324a;font-size:1.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)">🏠</a>
<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
function speak(t){if(!window.speechSynthesis||window.NOSOUND)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t));u.lang="en-IN";u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}
function burst(){var B=["⭐","🎈","🎉","🌟","💖","🦋"],cx=innerWidth/2,cy=innerHeight/3;
 for(var i=0;i<18;i++){(function(i){var $b=$("<span class='burst'>").text(B[i%6]).css({left:cx,top:cy,opacity:1}).appendTo("body"),a=Math.random()*6.28,d=90+Math.random()*140;
 setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)",opacity:0});},20);setTimeout(function(){$b.remove();},1200);})(i);}}

$(function(){
 var R=4,POW=[1000,100,10,1],H=[0,0,0,0],E=[0,0,0,0],mode="free",lv=0,stars=0,target=null,locked=false,$ab=$("#ab");
 for(var r=0;r<R;r++){var $r=$("<div class='rod'><i class='stick'></i></div>");
  $("<b class='bead h'>").data({r:r,t:"h"}).appendTo($r);
  for(var k=1;k<=4;k++)$("<b class='bead e'>").data({r:r,t:"e",k:k}).appendTo($r);
  $ab.append($r);}
 function place(){
  $ab.children().each(function(r){var $b=$(this).children("b");
   $b.eq(0).css("top",H[r]?52:4);
   for(var i=0;i<4;i++)$b.eq(i+1).css("top",i<E[r]?108+i*42:324-(4-i)*42+2);});
  var t=total();$("#num").text(t);if(target!==null&&!locked&&t===target)win();
 }
 function total(){var t=0;for(var r=0;r<R;r++)t+=(H[r]*5+E[r])*POW[r];return t;}
 function clear(){H=[0,0,0,0];E=[0,0,0,0];}
 function ask(){
  locked=false;clear();target=null;
  $("#lvl").text(new Array(Math.min(lv+1,10)+1).join("🟠"));
  if(mode==="free"){$("#q").text("");place();return;}
  var l=Math.min(lv,3);
  if(mode==="show"){target=rnd([1,10,100,1000][l],[9,99,999,9999][l]);$("#q").text("🎯 "+target);speak("Show me "+target);}
  else{var m=[9,50,500,4000][l],a=rnd(1,m),b=rnd(1,m);target=a+b;$("#q").text(a+" + "+b+" = ?");speak(a+" plus "+b);}
  place();
 }
 function win(){locked=true;stars++;lv++;$("#stars").text("⭐ "+stars);burst();speak(["Great job!","You did it!","Super!","Hooray!"][rnd(0,3)]);setTimeout(ask,1800);}
 $ab.on("click",".bead",function(){
  if(locked)return;var d=$(this).data(),r=d.r;
  if(d.t==="h")H[r]^=1;else E[r]=E[r]>=d.k?d.k-1:d.k;
  place();
 });
 $("#tabs").on("click",".tab[data-m]",function(){$("#tabs .tab").removeClass("on");$(this).addClass("on");mode=$(this).data("m");ask();});
 $("#reset").on("click",function(){clear();place();});
 $("#num").on("click",function(){speak(total());});
 $("#snd").on("click",function(){window.NOSOUND=!window.NOSOUND;$(this).text(window.NOSOUND?"🔇":"🔊");});
 ask();
});
</script>
</body>
</html>
