<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle World</title>
<script src="jquery.min.js"></script>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:560px;margin:0 auto;padding:14px}
.row{display:flex;gap:10px}
.tab{flex:1;border:0;border-radius:20px;background:var(--card);font-size:2.2rem;padding:10px 0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s}
.tab.on{background:#ff9f1c;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 4px;font-size:1.5rem;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.board{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.18);text-align:center;min-height:360px}
.grid{display:grid;gap:10px;margin:0 auto;max-width:420px}
.mcard{aspect-ratio:1;border:0;border-radius:18px;background:linear-gradient(145deg,#8c7bff,#6bb8ff);font-size:2.6rem;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mcard.up{background:#fff3c4;color:inherit;animation:flip .35s}
.mcard.done{background:#c8f5d6;animation:pop .5s}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@keyframes pop{50%{transform:scale(1.15)}}
.piece{aspect-ratio:1;border-radius:10px;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);background-repeat:no-repeat}
.piece.sel{outline:5px solid #ff9f1c;transform:scale(.92)}
.prev{width:96px;height:96px;border-radius:14px;margin:0 auto 12px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.big{font-size:6rem;line-height:1.1}
.opt{border:0;border-radius:22px;background:#eef6ff;font-size:3.6rem;padding:10px 0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.opt:active{transform:translateY(3px)}
.sil{filter:brightness(0)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 20px;font-size:3rem}
.slot{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#eef6ff}
.slot.q{background:#ffe8a3;border:4px dashed #ff9f1c;animation:pop 1.2s infinite}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opts .opt{width:90px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:2.4rem;transition:transform 1.1s ease-out,opacity 1.1s}
#snd{border:0;background:none;font-size:1.8rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="container">
  <div class="row" id="tabs">
    <button class="tab on" data-g="mem" aria-label="Memory">🧠</button>
    <button class="tab" data-g="jig" aria-label="Jigsaw">🧩</button>
    <button class="tab" data-g="sha" aria-label="Shadow">👤</button>
    <button class="tab" data-g="pat" aria-label="Pattern">🔷</button>
  </div>
  <div class="bar"><span id="lvl"></span><span id="stars">⭐ 0</span><button id="snd" aria-label="Sound">🔊</button></div>
  <div class="board" id="board"></div>
</div>
<script>
$(function(){
  var game="mem",lv={mem:0,jig:0,sha:0,pat:0},stars=0,locked=false,sound=true;
  var EM=["🐶","🐱","🐰","🦁","🐸","🐵","🐼","🐯","🦊","🐷","🐘","🦒","🐢","🐠","🦋","🚗","🚀","🍎","🐞","🦆"];
  var PAT=["🔴","🔵","🟡","🟢","🟣","🟠","⭐","❤️"];
  var SCENES=[
   "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='#8fd3ff'/><circle cx='235' cy='65' r='38' fill='#ffd93d'/><ellipse cx='150' cy='300' rx='230' ry='110' fill='#4cc16a'/><rect x='95' y='150' width='110' height='90' fill='#ff7a7a'/><polygon points='80,152 150,92 220,152' fill='#8a4b2a'/><rect x='135' y='190' width='30' height='50' fill='#ffe08a'/><circle cx='50' cy='190' r='30' fill='#2f9e44'/><rect x='45' y='210' width='10' height='40' fill='#7a4a21'/></svg>",
   "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='#1e90ff'/><rect y='250' width='300' height='50' fill='#f4d58d'/><ellipse cx='140' cy='140' rx='70' ry='42' fill='#ff9f1c'/><polygon points='205,140 265,95 265,185' fill='#ff6b6b'/><circle cx='105' cy='128' r='10' fill='#fff'/><circle cx='107' cy='128' r='5' fill='#222'/><circle cx='60' cy='60' r='14' fill='#bfe9ff'/><circle cx='90' cy='30' r='9' fill='#bfe9ff'/><circle cx='230' cy='230' r='12' fill='#bfe9ff'/></svg>",
   "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='#1b1b4b'/><circle cx='40' cy='40' r='4' fill='#fff'/><circle cx='250' cy='60' r='5' fill='#fff'/><circle cx='80' cy='250' r='4' fill='#fff'/><circle cx='260' cy='240' r='60' fill='#8c7bff'/><ellipse cx='260' cy='240' rx='85' ry='14' fill='none' stroke='#ffd93d' stroke-width='6'/><ellipse cx='140' cy='140' rx='36' ry='80' fill='#f1f3f5'/><polygon points='104,100 140,40 176,100' fill='#ff6b6b'/><circle cx='140' cy='130' r='16' fill='#4dabf7'/><polygon points='115,200 140,260 165,200' fill='#ff9f1c'/></svg>"
  ];
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
  function speak(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}
  function burst(){
    var B=["⭐","🎈","🎉","🌟","💖","🦋"],cx=innerWidth/2,cy=innerHeight/2;
    for(var i=0;i<20;i++){(function(i){
      var $b=$("<span class='burst'>").text(B[i%6]).css({left:cx,top:cy,opacity:1}).appendTo("body"),a=Math.random()*6.28,d=90+Math.random()*150;
      setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) rotate("+rnd(0,360)+"deg)",opacity:0});},20);
      setTimeout(function(){$b.remove();},1200);})(i);}
  }
  function win(){
    locked=true;stars++;lv[game]++;
    $("#stars").text("⭐ "+stars);burst();
    speak(["Great job!","You did it!","Super smart!","Hooray!"][rnd(0,3)]);
    setTimeout(next,1800);
  }
  function wrong($e){speak("Try again!");$e.addClass("shake");setTimeout(function(){$e.removeClass("shake");},400);}
  function next(){
    locked=false;
    $("#lvl").text(new Array(Math.min(lv[game]+1,10)+1).join("🟠"));
    var $b=$("#board").empty();
    ({mem:memory,jig:jigsaw,sha:shadow,pat:pattern})[game]($b);
  }
  /* 🧠 Memory match: more pairs each level */
  function memory($b){
    var pairs=[2,3,4,6,8,10][Math.min(lv.mem,5)],ic=shuffle(EM).slice(0,pairs),cards=shuffle(ic.concat(ic)),first=null,matched=0;
    var $g=$("<div class='grid'>").css("grid-template-columns","repeat("+(cards.length<=4?2:cards.length<=12?4:5)+",1fr)").appendTo($b);
    $.each(cards,function(_,e){
      $("<button class='mcard'>").text("❓").data("e",e).appendTo($g);
    });
    $g.on("click",".mcard",function(){
      var $c=$(this);if(locked||$c.hasClass("up")||$c.hasClass("done"))return;
      $c.addClass("up").text($c.data("e"));
      if(!first){first=$c;return;}
      var a=first,b=$c;first=null;
      if(a.data("e")===b.data("e")){a.add(b).removeClass("up").addClass("done");matched++;if(matched===pairs)win();}
      else{locked=true;setTimeout(function(){a.add(b).removeClass("up").text("❓");locked=false;},800);}
    });
  }
  /* 🧩 Jigsaw: tap two pieces to swap; more pieces each level */
  function jigsaw($b){
    var n=[2,3,3,4][Math.min(lv.jig,3)],uri="url(\"data:image/svg+xml;utf8,"+encodeURIComponent(SCENES[lv.jig%3])+"\")",order,sel=-1,i,N=n*n;
    function solved(){for(var k=0;k<N;k++)if(order[k]!==k)return false;return true;}
    do{order=shuffle($.map(new Array(N),function(_,k){return k;}));}while(solved());
    $("<div class='prev'>").css({backgroundImage:uri,backgroundSize:"100% 100%"}).appendTo($b);
    var $g=$("<div class='grid'>").css("grid-template-columns","repeat("+n+",1fr)").appendTo($b);
    function draw(){
      $g.empty();
      $.each(order,function(pos,p){
        $("<div class='piece'>").toggleClass("sel",pos===sel).data("pos",pos).css({
          backgroundImage:uri,backgroundSize:(n*100)+"% "+(n*100)+"%",
          backgroundPosition:((p%n)/(n-1)*100)+"% "+(((p/n)|0)/(n-1)*100)+"%"}).appendTo($g);
      });
    }
    draw();
    $g.on("click",".piece",function(){
      if(locked)return;var pos=$(this).data("pos");
      if(sel<0){sel=pos;draw();return;}
      var t=order[sel];order[sel]=order[pos];order[pos]=t;sel=-1;draw();
      if(solved())win();
    });
  }
  /* 👤 Shadow match: more shadows each level */
  function shadow($b){
    var k=[2,3,4,5][Math.min(lv.sha,3)],pool=shuffle(EM),target=pool[0],opts=shuffle(pool.slice(0,k));
    $("<div class='big'>").text(target).appendTo($b);
    $("<div style='font-size:2rem;margin:6px'>⬇️</div>").appendTo($b);
    var $o=$("<div class='opts'>").appendTo($b);
    $.each(opts,function(_,e){$("<button class='opt'>").append($("<span class='sil'>").text(e)).data("e",e).appendTo($o);});
    $o.on("click",".opt",function(){if(locked)return;if($(this).data("e")===target)win();else wrong($(this));});
  }
  /* 🔷 Pattern: longer patterns, then a hole in the middle */
  function pattern($b){
    var u=[2,2,3,3,4,4][Math.min(lv.pat,5)],pool=shuffle(PAT),unit=pool.slice(0,u),L=u*3,seq=[],i;
    for(i=0;i<L;i++)seq.push(unit[i%u]);
    var miss=lv.pat<2?L-1:rnd(u,L-1),ans=seq[miss];
    var $s=$("<div class='seq'>").appendTo($b);
    $.each(seq,function(i,e){$("<div class='slot'>").toggleClass("q",i===miss).text(i===miss?"❓":e).appendTo($s);});
    var opts=shuffle(unit.concat([pool[u]])),$o=$("<div class='opts'>").appendTo($b);
    $.each(opts,function(_,e){$("<button class='opt'>").text(e).data("e",e).appendTo($o);});
    $o.on("click",".opt",function(){
      if(locked)return;
      if($(this).data("e")===ans){$s.find(".q").removeClass("q").text(ans);win();}else wrong($(this));
    });
  }
  $("#tabs").on("click",".tab",function(){$("#tabs .tab").removeClass("on");$(this).addClass("on");game=$(this).data("g");next();});
  $("#snd").on("click",function(){sound=!sound;$(this).text(sound?"🔊":"🔇");if(!sound&&window.speechSynthesis)speechSynthesis.cancel();});
  next();
});
</script>
<a href="index.html" id="homeFab" aria-label="Home" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;color:#23324a;font-size:1.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)">🏠</a>
</body>
</html>
