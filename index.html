<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun Learning World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--pill:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;--ink:#23324a;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;overflow-x:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:16px}
.text-center{text-align:center}
.mascot{font-size:6rem;line-height:1;cursor:pointer;display:inline-block;animation:wave 2.4s ease-in-out infinite;user-select:none}
@keyframes wave{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-10px)}}
.rainbow{font-size:2.4rem;letter-spacing:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:14px}
.tile{display:block;text-decoration:none;color:var(--ink);border-radius:32px;padding:20px 14px 16px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.18),0 14px 26px rgba(0,0,0,.2);transition:transform .15s;position:relative;overflow:hidden;
  animation:pop-in .6s both}
.tile:hover{transform:translateY(-6px) scale(1.03)}
.tile:active{transform:translateY(4px) scale(.97);box-shadow:0 4px 0 rgba(0,0,0,.18)}
@keyframes pop-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.pic{height:150px;display:flex;align-items:center;justify-content:center}
.pic .emoji{font-size:7.5rem;line-height:1;animation:bounce 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.pic img,.pic video{max-width:100%;max-height:150px;border-radius:20px;object-fit:cover}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.08)}}
.pill{display:inline-block;background:var(--pill);color:var(--ink);border-radius:999px;padding:6px 20px;font-size:1.3rem;font-weight:700;margin-top:6px}
.float{position:fixed;z-index:1;pointer-events:none;bottom:-80px;animation:rise linear infinite;opacity:.8}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:2rem;transition:transform 1s ease-out,opacity 1s;opacity:1}
#sound{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;border:0;border-radius:50%;width:56px;height:56px;font-size:1.8rem;background:var(--pill);cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="sound" aria-label="Sound">🔊</button>
<div class="container">
  <div class="text-center">
    <div class="mascot" id="mascot">🦉</div>
    <div class="rainbow">🌈⭐🎈⭐🌈</div>
  </div>
  <div class="row" id="apps"></div>
</div>
<script>
$(function(){
  /* ====== ADD NEW APPS HERE ======
     Copy one line, change the values:
       name  : short word (for parents; kids use the picture)
       emoji : big picture
       color / color2 : tile gradient colours
       url   : link to your app
       say   : words spoken aloud when the child taps
       img   : (optional) a picture file, e.g. "images/math.jpg"
       video : (optional) a short looping video file, e.g. "videos/math.mp4"
     img and video work when this page is hosted with those files next to it (e.g. on Vercel). */
  var APPS=[
    {name:"Math",emoji:"🔢",color:"#ff6b6b",color2:"#ffb86b",url:"https://fun-math1.vercel.app/",say:"Let’s play with numbers!"},
    {name:"Letters",emoji:"✏️",color:"#4ecdc4",color2:"#7be0a8",url:"https://letters1.vercel.app/",say:"Let’s learn to write letters!"},
    {name:"Science",emoji:"🔬",color:"#8c7bff",color2:"#6bb8ff",url:"https://science-games1.vercel.app/",say:"Let’s be little scientists!"}
  ];
  var sound=true,BURST=["⭐","🎈","🎉","🌟","💖","🦋"];
  function speak(t){
    if(!sound||!window.speechSynthesis)return;
    try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}
  }
  function burst(x,y){
    for(var i=0;i<18;i++){
      var $b=$("<span class='burst'>").text(BURST[i%BURST.length]).css({left:x-14,top:y-14}).appendTo("body");
      (function($b){
        var a=Math.random()*6.28,d=80+Math.random()*120;
        setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) rotate("+(Math.random()*360)+"deg)",opacity:0});},20);
        setTimeout(function(){$b.remove();},1100);
      })($b);
    }
  }
  var $apps=$("#apps");
  $.each(APPS,function(i,a){
    var pic=a.video?"<video src='"+a.video+"' autoplay muted loop playsinline></video>"
           :a.img?"<img src='"+a.img+"' alt=''>"
           :"<span class='emoji'>"+a.emoji+"</span>";
    var $t=$("<a class='tile' target='_blank' rel='noopener'>")
      .attr("href",a.url)
      .css({background:"linear-gradient(145deg,"+a.color+","+a.color2+")",animationDelay:(i*.15)+"s"})
      .html("<div class='pic'>"+pic+"</div><span class='pill'></span>");
    $t.find(".pill").text(a.name);
    $t.on("click",function(e){burst(e.clientX,e.clientY);speak(a.say);});
    $apps.append($t);
  });
  $("#mascot").on("click",function(e){burst(e.clientX,e.clientY);speak("Hello friend! Tap a picture to play!");});
  $("#sound").on("click",function(){sound=!sound;$(this).text(sound?"🔊":"🔇");if(!sound&&window.speechSynthesis)speechSynthesis.cancel();});
  var FL=["☁️","🎈","⭐","🦋","🌈","🐝","🌸"];
  for(var k=0;k<14;k++){
    $("<span class='float'>").text(FL[k%FL.length]).css({left:(k*7.3)%100+"%",fontSize:(1.6+Math.random()*2)+"rem",animationDuration:(14+Math.random()*14)+"s",animationDelay:(-Math.random()*20)+"s"}).appendTo("body");
  }
});
</script>
</body>
</html>
