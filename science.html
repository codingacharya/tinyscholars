<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Scientist Games</title>
<script src="jquery.min.js"></script>
<style>
:root{--bg:#eefaf8;--card:#ffffff;--text:#23324a;--accent:#ff6b6b;--accent2:#4ecdc4;--muted:#dcebe8;--good:#1e9e57;--bad:#d9822b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14232b;--card:#1f3440;--text:#eaf6f4;--muted:#2c4856;--good:#4cd48a;--bad:#f0a050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14232b;--card:#1f3440;--text:#eaf6f4;--muted:#2c4856;--good:#4cd48a;--bad:#f0a050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;font-size:1.1rem}
.container{max-width:640px;margin:0 auto;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.col{flex:1 1 0;min-width:100px}
.text-center{text-align:center}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn{border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn-lg{font-size:2rem;width:100%;padding:14px 8px}
.btn-info{background:var(--accent2);color:#10302d}
.btn-primary{background:var(--accent)}
.btn-light{background:var(--muted);color:var(--text)}
.btn-light.active{background:var(--accent);color:#fff}
h1{margin:4px 0 12px;font-size:1.9rem}
.scene{font-size:2.3rem;line-height:1.3;min-height:70px}
.big{font-size:4rem}
#msg{min-height:3rem;font-weight:700;font-size:1.2rem;margin:10px 0}
.tank{position:relative;width:200px;height:150px;margin:8px auto;border:4px solid var(--muted);border-top:0;border-radius:0 0 16px 16px;overflow:hidden}
.water{position:absolute;inset:auto 0 0 0;height:65%;background:rgba(78,205,196,.45)}
.obj{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:2.4rem;transition:top 1.2s ease-in}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.steps{font-size:.95rem;opacity:.85;margin-top:10px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="container">
  <h1 class="text-center">🔬 Little Scientist Games</h1>
  <div class="row" id="tabs" style="margin-bottom:12px">
    <button class="col btn btn-light active" data-g="sink">💧 Sink or Float</button>
    <button class="col btn btn-light" data-g="pattern">🔢 Patterns</button>
    <button class="col btn btn-light" data-g="odd">🕵️ Odd One Out</button>
  </div>
  <div class="card text-center">
    <div id="score">Stars: 0</div>
    <p id="question"></p>
    <div id="scene" class="scene"></div>
    <div id="msg"></div>
    <div class="row" id="options"></div>
  </div>
  <p class="steps text-center">Scientist steps: 1) Guess 2) Test 3) Look at what happened 4) Explain why</p>
</div>
<script>
$(function(){
  var game="sink",score=0,locked=false,ans,lastSink=-1;
  var THINGS=[
    {e:"🪨",n:"rock",f:false,w:"It is heavy for its size."},
    {e:"🍎",n:"apple",f:true,w:"It has air inside, so it is light for its size."},
    {e:"🪙",n:"coin",f:false,w:"Metal is heavy for its size."},
    {e:"🪵",n:"wood",f:true,w:"Wood is lighter than water."},
    {e:"🎈",n:"balloon",f:true,w:"It is full of air."},
    {e:"🔑",n:"key",f:false,w:"Metal is heavy for its size."},
    {e:"🧊",n:"ice cube",f:true,w:"Ice is a little lighter than water."},
    {e:"🪶",n:"feather",f:true,w:"It is very light."},
    {e:"🔩",n:"bolt",f:false,w:"Metal is heavy for its size."},
    {e:"⚽",n:"ball",f:true,w:"It is full of air."},
    {e:"🥕",n:"carrot",f:false,w:"It is a little heavier than water."},
    {e:"🍇",n:"grapes",f:false,w:"They are a little heavier than water."}
  ];
  var GROUPS={animals:["🐶","🐱","🐰","🐻","🐸"],fruits:["🍎","🍌","🍇","🍓","🍊"],vehicles:["🚗","🚌","🚲","✈️","🚂"],"things in the sky":["☀️","🌙","⭐","☁️","🌈"]};
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
  function choices(list,cls){
    var $o=$("#options").empty();
    $.each(list,function(_,v){$("<div class='col'>").append($("<button class='btn btn-lg "+(cls||"btn-info")+"'>").text(v).data("v",v)).appendTo($o);});
  }
  function say(t,c){$("#msg").text(t).css("color",c||"inherit");}
  function win(){
    score++;$("#score").text("Stars: "+score+" "+new Array(Math.min(score,10)+1).join("⭐")).addClass("pop");
    setTimeout(function(){$("#score").removeClass("pop");},500);
  }
  function next(){
    locked=false;say("");
    if(game==="sink"){
      var i;do{i=rnd(0,THINGS.length-1);}while(i===lastSink);lastSink=i;
      var t=THINGS[i];ans=t;
      $("#question").text("Will the "+t.n+" float or sink? Make a guess!");
      $("#scene").html("<div class='big'>"+t.e+"</div><div class='tank'><div class='water'></div><span class='obj' id='obj'>"+t.e+"</span></div>");
      var $o=$("#options").empty();
      $o.append("<div class='col'><button class='btn btn-lg btn-info' data-f='1'>🛟 Float</button></div>");
      $o.append("<div class='col'><button class='btn btn-lg btn-primary' data-f='0'>⚓ Sink</button></div>");
    } else if(game==="pattern"){
      $("#question").text("What comes next?");
      if(Math.random()<.5){
        var step=[1,2,3,5,10][rnd(0,4)],s=rnd(1,5),seq=[];
        for(var k=0;k<4;k++)seq.push(s+k*step);
        ans=String(s+4*step);
        $("#scene").text(seq.join(", ")+", ?");
        var opts=[ans];while(opts.length<3){var x=String(s+4*step+rnd(-3,3)*Math.max(1,step>3?1:1));if(opts.indexOf(x)<0&&+x>0)opts.push(x);}
        choices(shuffle(opts));
      } else {
        var pool=shuffle(["🔴","🔵","🟡","🟢","🟣"]),unit=[[0,1],[0,0,1],[0,1,2]][rnd(0,2)],em=[];
        for(var j=0;j<unit.length*3;j++){em.push(pool[unit[j%unit.length]]);}
        var cut=Math.max(unit.length*2+1,em.length-unit.length+1);
        ans=pool[unit[cut%unit.length]];
        $("#scene").text(em.slice(0,cut).join(" ")+" ?");
        choices(shuffle(pool.slice(0,3)));
      }
    } else {
      $("#question").text("Which one does not belong?");
      var names=shuffle(Object.keys(GROUPS)),a=GROUPS[names[0]],b=GROUPS[names[1]];
      var three=shuffle(a).slice(0,3),odd=shuffle(b)[0];
      ans=odd;ans_why="The others are all "+names[0]+".";
      $("#scene").text("");
      choices(shuffle(three.concat([odd])));
    }
  }
  var ans_why="";
  $("#options").on("click","button",function(){
    if(locked)return;
    if(game==="sink"){
      locked=true;
      var guess=$(this).data("f")==1,right=guess===ans.f;
      $("#obj").css("top",ans.f?"34px":"96px");
      setTimeout(function(){
        say((right?"Great guess! 🎉 ":"Not this time! 🤔 ")+"The "+ans.n+" "+(ans.f?"floats":"sinks")+". "+ans.w,right?"var(--good)":"var(--bad)");
        if(right)win();
        $("#options").html("<div class='col'><button class='btn btn-lg btn-primary' id='nx'>Next ➡️</button></div>");
      },1400);
      return;
    }
    var v=$(this).data("v");
    if(String(v)===String(ans)){
      locked=true;win();
      say("You did it! 🌟 "+(game==="odd"?ans_why:""),"var(--good)");
      setTimeout(next,1600);
    } else {
      say("Look again! 💪","var(--bad)");
      var $b=$(this).addClass("shake");setTimeout(function(){$b.removeClass("shake");},400);
    }
  });
  $("#options").on("click","#nx",next);
  $("#tabs").on("click","button",function(){
    $("#tabs button").removeClass("active");$(this).addClass("active");
    game=$(this).data("g");next();
  });
  next();
});
</script>
<a href="index.html" id="homeFab" aria-label="Home" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;color:#23324a;font-size:1.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)">🏠</a>
</body>
</html>
