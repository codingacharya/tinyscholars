<title>Class 2 Fun Zone</title>
<style>
:root{--sky1:#8fd3ff;--sky2:#c9b6ff;--sky3:#ffd6e8;--ink:#23324a;--card:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1c2b5a;--sky2:#3a2a6b;--sky3:#5a2a52;color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(135deg,var(--sky1),var(--sky2),var(--sky3),var(--sky1));background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:520px;margin:0 auto;padding:12px 12px 90px}
.row{display:flex;gap:10px}
.tab,.ib{border:0;border-radius:18px;background:var(--card);color:var(--ink);font-size:2rem;padding:8px 0;flex:1;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tab.on,.ib.on{background:#ff9f1c;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 4px;font-size:1.5rem;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.board{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.18);text-align:center;min-height:340px}
.opt{border:0;border-radius:20px;background:#eef6ff;color:var(--ink);font-size:2.4rem;padding:10px 14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.opt:active{transform:translateY(3px)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2.4rem;transition:transform 1.1s ease-out,opacity 1.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mz{display:grid;max-width:340px;margin:0 auto 12px;border:4px solid #6b4f3a;background:#fff9e6}
.mc{aspect-ratio:1;border:0 solid #6b4f3a;display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center}.pad .opt{padding:6px 0;font-size:1.8rem}
.scale{position:relative;height:190px;margin:10px 0}
.beam{position:absolute;left:5%;right:5%;top:30px;height:8px;background:#8a5a3a;border-radius:4px;transition:transform 1s ease;transform-origin:50% 50%}
.pan{position:absolute;top:8px;width:46%;min-height:80px;border-bottom:6px solid #6b4f3a;font-size:1.7rem;line-height:1.2;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end}
.pan.l{left:-4%}.pan.r{right:-4%}
.post{position:absolute;left:50%;top:34px;width:10px;height:150px;margin-left:-5px;background:#8a5a3a;border-radius:5px}
.legend{font-size:1.6rem;margin-bottom:6px}
.track{display:flex;flex-wrap:wrap;gap:6px;min-height:84px;justify-content:center;margin-bottom:14px;font-size:2.2rem}
.wag{border:0;border-radius:16px;background:#ffe8a3;color:var(--ink);font-size:1.9rem;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-width:66px}
.wag small{display:block;font-size:1.5rem;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.big{font-size:2.4rem;margin:6px 0;line-height:1.3}
.plate{display:inline-block;border:3px dashed #ffb347;border-radius:14px;padding:2px 8px;margin:3px;font-size:1.5rem}
.coin{display:inline-flex;width:54px;height:54px;border-radius:50%;background:#ffd24d;border:4px solid #e0a800;align-items:center;justify-content:center;font-weight:700;margin:3px;color:#23324a}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.tt{border:0;border-radius:22px;background:var(--card);color:var(--ink);padding:14px 6px 10px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.16);font-family:inherit}
.tt:active{transform:translateY(4px)}.tt .ic{display:block;font-size:3.2rem}.tt .nm{display:block;font-weight:700;font-size:1.05rem;margin-top:2px}.tt .st{display:block;font-size:.95rem;min-height:1.3rem}
h1{text-align:center;color:#fff;text-shadow:0 3px 4px rgba(0,0,0,.35);font-size:2rem;margin:4px 0 10px}
.sm{border:0;border-radius:16px;background:var(--card);color:var(--ink);font-size:1.2rem;font-weight:700;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);margin:4px}
#qa{font-size:1.3rem;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#qa svg{max-width:100%}
.opts .opt{font-size:1.6rem;min-width:96px}
.ok{font-size:2rem;min-height:2.6rem}
</style>
</head>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
function speak(t){if(!window.speechSynthesis||window.NOSOUND)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t));u.lang="en-IN";u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}
function burst(){var B=["⭐","🎈","🎉","🌟","💖","🦋"],cx=innerWidth/2,cy=innerHeight/3;
 for(var i=0;i<18;i++){(function(i){var $b=$("<span class='burst'>").text(B[i%6]).css({left:cx,top:cy,opacity:1}).appendTo("body"),a=Math.random()*6.28,d=90+Math.random()*140;
 setTimeout(function(){$b.css({transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)",opacity:0});},20);setTimeout(function(){$b.remove();},1200);})(i);}}


$(function(){
 var EMS=["🍪","🍎","⭐","🐟","🎈"],prog={},SAVE="ts_class2",sess=null,locked=false,cur="m";
 try{prog=JSON.parse(localStorage.getItem(SAVE)||"{}");}catch(e){}
 function save(){try{localStorage.setItem(SAVE,JSON.stringify(prog));}catch(e){}}
 function say(t,l){if(!window.speechSynthesis||window.NOSOUND)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,""));u.lang=l||"en-IN";u.rate=.9;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}}
 function pick(a,n,not){return shuffle(a.filter(function(x){return String(x)!==String(not);})).slice(0,n);}
 function mc(ans,pool,n){return shuffle([ans].concat(pick(pool,n||2,ans)));}

 function clock(h,m){var a=((h%12)*30+m*.5)*Math.PI/180,b=m*6*Math.PI/180,s="<svg viewBox='0 0 120 120' width='160' height='160'><circle cx='60' cy='60' r='56' fill='#fff' stroke='#23324a' stroke-width='4'/>";
  for(var i=1;i<=12;i++){var t=i*Math.PI/6;s+="<text x='"+(60+44*Math.sin(t)).toFixed(1)+"' y='"+(60-44*Math.cos(t)+5).toFixed(1)+"' font-size='13' font-weight='700' text-anchor='middle' fill='#23324a'>"+i+"</text>";}
  s+="<line x1='60' y1='60' x2='"+(60+28*Math.sin(a)).toFixed(1)+"' y2='"+(60-28*Math.cos(a)).toFixed(1)+"' stroke='#e8333a' stroke-width='5' stroke-linecap='round'/><line x1='60' y1='60' x2='"+(60+42*Math.sin(b)).toFixed(1)+"' y2='"+(60-42*Math.cos(b)).toFixed(1)+"' stroke='#2b6fd9' stroke-width='3' stroke-linecap='round'/><circle cx='60' cy='60' r='4' fill='#23324a'/></svg>";return s;}

 var HO=[["ऊपर","नीचे"],["बड़ा","छोटा"],["दिन","रात"],["गरम","ठंडा"],["अच्छा","बुरा"],["आना","जाना"],["हँसना","रोना"],["सुबह","शाम"],["सच","झूठ"],["मीठा","कड़वा"]];
 var HN=[[1,"एक"],[2,"दो"],[3,"तीन"],[4,"चार"],[5,"पाँच"],[6,"छह"],[7,"सात"],[8,"आठ"],[9,"नौ"],[10,"दस"]];

 {id:"m1",s:"m",ic:"🧱",nm:"Tens & Ones",gen:function(){var t=rnd(1,9),o=rnd(0,9),n=t*10+o,alt=shuffle([n+10,n-10,o*10+t,n+1,n-1]).filter(function(x){return x!==n&&x>0&&x<100;});
   return {q:"<div class='big'>"+rep("🟦",t)+" "+rep("🔹",o)+"</div><div>🟦 = 10 &nbsp; 🔹 = 1<br>How many in all?</div>",say:"How many in all?",opts:shuffle([n].concat(alt.slice(0,2))),ans:n};}},

 {id:"m4",s:"m",ic:"🍪",nm:"Equal Groups",gen:function(){var g=rnd(2,5),n=rnd(2,5),e=EMS[rnd(0,4)],s="",i;for(i=0;i<g;i++)s+="<span class='plate'>"+rep(e,n)+"</span>";

 {id:"m6",s:"m",ic:"🪙",nm:"Coins",gen:function(){var V=[1,2,5,10],k=rnd(2,4),c="",sum=0,i,v;for(i=0;i<k;i++){v=V[rnd(0,3)];sum+=v;c+="<span class='coin'>₹"+v+"</span>";}
   return {q:"<div>"+c+"</div><div>How much money in all?</div>",say:"How much money in all?",opts:$.map(num3(sum,1,40),function(x){return "₹"+x;}),ans:"₹"+sum};}},
 {id:"m7",s:"m",ic:"📊",nm:"Count & Compare",gen:function(){var E=shuffle(EMS).slice(0,3),c,rows="",i;

 {id:"m8",s:"m",ic:"🔺",nm:"Shapes",bank:[["🔺 How many sides does a triangle have?","3",["2","4","5"]],["⬛ How many corners does a square have?","4",["3","5","6"]],["⚪ Which shape is round like a ball?","Circle",["Square","Triangle"]],["▭ A rectangle has how many sides?","4",["3","5","2"]],["Which shape has 3 corners?","Triangle",["Circle","Square"]],["🎲 A dice is shaped like a…","Cube",["Sphere","Cone"]],["⚽ A football is shaped like a…","Sphere",["Cube","Cone"]],["🍦 An ice-cream cone is shaped like a…","Cone",["Cube","Sphere"]],["🥫 A tin can is shaped like a…","Cylinder",["Cube","Cone"]]],fmt:sq},

 /* ---- English ---- */

 {id:"e2",s:"e",ic:"↔️",nm:"Opposites",bank:OPP,fmt:function(it){return {q:"<div>Opposite of</div><div class='big'><b>"+it[0]+"</b>?</div>",say:"Opposite of "+it[0],opts:mc(it[1],col(OPP,1)),ans:it[1]};}},

 {id:"e4",s:"e",ic:"🔡",nm:"Missing Letter",bank:[["🐶","d_g","o"],["🍎","a_ple","p"],["🐘","e_ephant","l"],["🐱","c_t","a"],["🌞","s_n","u"],["🐟","f_sh","i"],["🚌","b_s","u"],["🐸","fr_g","o"],["🌳","tr_e","e"],["📖","b_ok","o"]],fmt:function(it){return {q:"<div class='big'>"+it[0]+"</div><div class='big'><b>"+it[1]+"</b></div>",say:"Find the missing letter",opts:mc(it[2],["a","e","i","o","u","p","l"]),ans:it[2]};}},

 var SUBS=[["m","🔢","Maths"],["e","🔤","English"],["h","अ","हिंदी"],["v","🌳","EVS"],["x","⚡","Mix"]];
 function menu(){
  $("#play").hide();$("#menu").show();
  var $s=$("#subs").empty();
  $.each(SUBS,function(_,s){$("<button class='tab'>").toggleClass("on",s[0]===cur).text(s[1]).attr("aria-label",s[2]).on("click",function(){cur=s[0];menu();}).appendTo($s);});
  var $g=$("#tg").empty();
  if(cur==="x"){$("<button class='tt' style='grid-column:span 2'><span class='ic'>⚡</span><span class='nm'>Mixed Challenge · 10 questions</span><span class='st'></span></button>").on("click",function(){start({id:"mix",mix:1});}).appendTo($g).find(".st").text(prog.mix?(prog.mix>=9?"🏅 ":"")+rep("⭐",Math.round(prog.mix/2)):"");return;}
  $.each(TOP,function(_,t){if(t.s!==cur)return;
   var b=prog[t.id]||0;
   $("<button class='tt'><span class='ic'></span><span class='nm'></span><span class='st'></span></button>").on("click",function(){start(t);}).appendTo($g)
    .find(".ic").text(t.ic).end().find(".nm").text(t.nm).end().find(".st").text((b>=5?"🏅 ":"")+rep("⭐",b));});
 }
 function start(t){sess={t:t,i:0,stars:0,flawed:false,N:t.mix?10:5,deck:t.bank?shuffle(t.bank):null};$("#menu").hide();$("#play").show();nextQ();}
 function nextQ(){
  locked=false;sess.flawed=false;$("#ok").text("");
  var tp=sess.t,d;
  if(tp.mix)tp=TOP[rnd(0,TOP.length-1)];
  d=tp.bank?tp.fmt(sess.t.mix?tp.bank[rnd(0,tp.bank.length-1)]:sess.deck[sess.i%sess.deck.length]):tp.gen();
  sess.cur=d;sess.lang=tp.lang;
  $("#qa").html(d.q);
  var $o=$("#opts").empty();
  $.each(d.opts,function(_,v){$("<button class='opt'>").text(v).data("v",v).appendTo($o);});
  $("#dots").text(rep("🟠",sess.i)+rep("⚪",sess.N-sess.i)).css("font-size","1.1rem");
  $("#stars").text("⭐ "+sess.stars);
  say(d.say,sess.lang);
 }
 $("#opts").on("click",".opt",function(){
  if(locked)return;var $b=$(this);
  if(String($b.data("v"))===String(sess.cur.ans)){
   locked=true;if(!sess.flawed)sess.stars++;sess.i++;$("#ok").text("🌟 "+["Great!","Super!","Correct!","Well done!"][rnd(0,3)]);
   $("#stars").text("⭐ "+sess.stars);say("Correct");
   setTimeout(function(){sess.i>=sess.N?finish():nextQ();},1100);
  }else{sess.flawed=true;$("#ok").text("Try again 💪");say("Try again");$b.addClass("shake");setTimeout(function(){$b.removeClass("shake");},400);}
 });
 function finish(){
  var t=sess.t,sc=t.mix?sess.stars:sess.stars;
  if(sc>(prog[t.id]||0)){prog[t.id]=sc;save();}
  burst();say("Hooray! You got "+sc+" stars");
  $("#qa").html("<div class='big' style='font-size:4.5rem'>"+(sc>=sess.N-1?"🏅":"👏")+"</div><div class='big'>"+rep("⭐",Math.min(sc,10))+"</div><div>"+sc+" / "+sess.N+"</div>");
  $("#ok").text("");
  var $o=$("#opts").empty();
  $("<button class='sm'>🔁</button>").on("click",function(){start(t);}).appendTo($o);
  $("<button class='sm'>⬅️</button>").on("click",menu).appendTo($o);
 }
 $("#back").on("click",menu);
 $("#hear").on("click",function(){if(sess&&sess.cur)say(sess.cur.say,sess.lang);});
 menu();
});
